<form
  class="flex w-[min(90vw,420px)] flex-col gap-4 p-6"
  [formGroup]="form"
  (ngSubmit)="submit(form)"
>
  <div class="flex items-center gap-3">
    <span class="icon-tile"><span class="material-icons">lock</span></span>
    <h2 class="text-lg font-bold text-gray-900">Nur für Mitglieder</h2>
  </div>
  <p class="text-[15px] text-gray-600">
    Dieses Dokument ist geschützt. Bitte gib das Mitglieder-Passwort ein.
  </p>
  <div>
    <label class="form-label" for="document-password">Passwort</label>
    <input
      id="document-password"
      class="form-input"
      formControlName="password"
      type="password"
      autocomplete="current-password"
      required
      cdkFocusInitial
    />
  </div>
  <div class="flex flex-col-reverse gap-2.5 sm:flex-row sm:justify-end">
    <button type="button" class="btn-secondary" (click)="cancel()">Abbrechen</button>
    <button type="submit" class="btn-primary">
      Download <span class="material-icons text-xl">download</span>
    </button>
  </div>
</form>
