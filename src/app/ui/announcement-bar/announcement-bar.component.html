@if (visible) {
  <aside class="border-b border-pink-100 bg-pink-50" aria-label="Hinweis" animate.leave="animate-fade-out">
    <div
      class="mx-auto flex w-full max-w-page items-center gap-3 py-3 pl-4 pr-1 md:pl-8 md:pr-6 lg:py-2"
    >
      <span
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-pink-600 text-white"
        aria-hidden="true"
      >
        <span class="material-icons text-lg">campaign</span>
      </span>
      <p
        class="flex min-w-0 flex-1 flex-col text-[15px] leading-normal text-gray-800 lg:flex-row lg:items-center lg:gap-1.5"
      >
        @if (headline) {
          <span class="font-bold text-gray-900">{{ headline }}</span>
          <span class="hidden font-bold text-pink-600 lg:inline" aria-hidden="true">·</span>
        }
        <span class="font-medium">{{ details }}</span>
      </p>
      <button
        type="button"
        class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full text-gray-600 transition-colors hover:bg-pink-100 lg:h-10 lg:w-10"
        aria-label="Hinweis schließen"
        (click)="dismiss()"
      >
        <span class="material-icons text-[22px]">close</span>
      </button>
    </div>
  </aside>
}
