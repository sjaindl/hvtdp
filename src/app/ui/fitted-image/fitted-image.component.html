@if (!failed) {
  <img
    [src]="src"
    alt=""
    aria-hidden="true"
    class="absolute inset-0 h-full w-full scale-110 object-cover blur-xl brightness-75"
    loading="lazy"
  />
  <img
    [src]="src"
    [alt]="alt"
    class="relative h-full w-full object-contain transition-transform duration-500 group-hover:scale-105"
    loading="lazy"
    [appZoomable]="zoomable"
    [zoomGroup]="zoomGroup"
    [zoomIndex]="zoomIndex"
    [zoomCaption]="caption"
    (error)="failed = true"
  />
} @else {
  <div class="flex h-full items-center justify-center bg-pink-50">
    <img src="hvtdp.png" alt="" class="h-20 opacity-80" />
  </div>
}
