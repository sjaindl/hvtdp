<section class="bg-white lg:bg-gray-50">
  <div class="page-container flex justify-center py-12 lg:py-20">
    <div
      class="flex w-full max-w-xl flex-col items-center gap-4 text-center lg:rounded-2xl lg:border lg:border-gray-100 lg:bg-white lg:p-10 lg:shadow-sm"
    >
      <span class="flex h-20 w-20 items-center justify-center rounded-[20px] bg-gray-900">
        <span class="flex h-[52px] w-[52px] items-center justify-center rounded-[14px] bg-pink-600">
          <span class="material-icons text-3xl text-white">sports_soccer</span>
        </span>
      </span>
      <p class="eyebrow">Unsere Manager-App</p>
      <h1 class="text-[26px] font-extrabold text-gray-900 lg:text-3xl">Weiter zu Starting 11</h1>
      <p class="text-base leading-relaxed text-gray-600">
        Du wirst in wenigen Sekunden weitergeleitet. Stell deine Traumelf aus dem HV TDP Kader auf und sammle Punkte
        bei jedem Spiel.
      </p>
      <div class="h-1.5 w-full overflow-hidden rounded-full bg-gray-100" role="progressbar" aria-label="Weiterleitung">
        <div
          class="h-full rounded-full bg-pink-600"
          [style.animation]="'redirect-progress ' + delaySeconds + 's linear forwards'"
        ></div>
      </div>
      <span class="inline-flex items-center gap-1.5 rounded-full bg-gray-100 px-3 py-1.5 text-[13px] font-medium text-gray-600">
        <span class="material-icons text-sm text-gray-500">lock</span>{{ host }}
      </span>
      <div class="flex w-full flex-col gap-2.5 pt-2 sm:w-auto sm:flex-row">
        <a [href]="url" target="_blank" rel="noopener" class="btn-primary"
          >Jetzt öffnen <span class="material-icons text-xl">open_in_new</span></a
        >
        <a routerLink="/home" class="btn-secondary">Zurück zur Startseite</a>
      </div>
    </div>
  </div>
</section>
